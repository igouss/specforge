[package]
name = "specforge"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Compiles Markdown specifications (EARS with Gherkin stories) into a requirement trace, assesses it against step definitions, and runs the stories"
repository = "https://github.com/igouss/specforge"
readme = "README.md"
keywords = ["gherkin", "cucumber", "requirements", "specification", "ears"]
categories = ["development-tools::testing"]

[features]
cucumber = ["dep:cucumber"]
ledger-fs = []
proptest-adapter = ["dep:proptest"]
verification = ["ledger-fs", "proptest-adapter"]
cli = ["verification"]

[dependencies]
cucumber = { version = "0.23", optional = true }
gherkin = "0.16"
hex = "0.4"
proptest = { version = "1", optional = true }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }

[[bin]]
name = "specforge"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "stories"
harness = false
required-features = ["cucumber", "verification", "cli"]

[lints.rust]
unused_must_use = "deny"
unsafe_code = "forbid"

[lints.clippy]
wildcard_enum_match_arm = "deny"
unwrap_used = "deny"
expect_used = "deny"
