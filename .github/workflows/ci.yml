name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just check
      - name: Check individual feature combinations
        run: |
          cargo check --no-default-features
          cargo check --features cucumber
          cargo check --features ledger-fs
          cargo check --features proptest-adapter
          cargo check --features cli
